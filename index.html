<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лаборатория орфограмм — 3 класс</title><style>
:root{font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#233454;background:#e9f2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#fff5ce,transparent 40%),linear-gradient(125deg,#def5ff,#eff0ff 60%,#e8f9ef);min-height:100vh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #edac3b;outline-offset:2px}.wrap{max-width:1030px;margin:auto;padding:15px 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{color:#303c90;font-size:clamp(18px,3vw,27px);font-weight:900}.meter{background:#fff;border-radius:50px;padding:8px 14px;font-weight:750;color:#4e6186}.rail{height:11px;background:#d0dff6;border-radius:30px;overflow:hidden;margin:13px 0 20px}.rail div{height:100%;background:linear-gradient(90deg,#56bbda,#6c71d8);transition:.2s}.page{background:#fff;border:2px solid #d8e5fa;border-radius:25px;box-shadow:0 10px 35px #2039641a;padding:clamp(17px,3vw,32px);min-height:550px}h1{color:#283d82;font-size:clamp(28px,5vw,44px);margin:8px 0 14px}h2{color:#293e81;font-size:clamp(25px,4vw,34px);margin:6px 0 13px}h3{color:#334e8c}.lead{font-size:clamp(17px,2.4vw,20px);line-height:1.5;max-width:840px}.small{color:#61728d;font-size:14px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#645bad;font-weight:900}.hero{font-size:clamp(65px,12vw,110px);text-align:center}.actions,.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.btn{border:0;background:#505fc1;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;min-height:46px;box-shadow:0 3px 0 #394497}.btn.alt{background:#ebf0ff;color:#354990;box-shadow:none;border:2px solid #cddaf8}.btn.good{background:#128a70;box-shadow:0 3px 0 #0a6955}.btn:disabled{opacity:.5;cursor:default}.chip{border:2px solid #c7d4eb;background:#f9fbff;color:#27385c;border-radius:13px;padding:12px 15px;min-height:48px;font-weight:750;font-size:18px}.chip.selected{background:#dedfff;border-color:#6960cd}.chip.done{background:#dff8ed;border-color:#33b08e}.chip.no{background:#fff1e7;border-color:#dd9666}.box{background:#f4f7ff;border:1px solid #dde5fa;border-radius:17px;padding:17px;margin:13px 0}.note{background:#ecf5ff;border-left:5px solid #72a6eb;border-radius:12px;padding:12px 16px;margin:16px 0;line-height:1.5}.warn{background:#fff6e7;border-left-color:#e5b05c}.feedback{padding:12px 15px;border-radius:13px;background:#eef3ff;margin:12px 0;line-height:1.5}.feedback.ok{background:#e5f8ed;color:#205b3d}.feedback.err{background:#fff0e7;color:#81502e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.option{display:block;width:100%;text-align:left;padding:13px 15px;margin:7px 0;border:2px solid #d5dff2;background:#fff;border-radius:13px;color:#27395e;font-weight:700}.option.active{border-color:#6766cb;background:#edefff}.option:disabled{cursor:default}.word{font-size:clamp(25px,4vw,32px);font-weight:850;color:#284487}.counter{display:inline-block;background:#e6e9ff;color:#414a98;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:800}.separator{height:1px;background:#dce5f6;margin:19px 0}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:15px;flex-wrap:wrap}.input{border:2px solid #baccec;background:white;border-radius:13px;padding:12px 14px;max-width:360px;width:100%;font-size:20px}.big{font-size:24px;font-weight:800;color:#32498f}.wordparts{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0}.letter{border:2px solid #bdcbea;background:#f6f9ff;color:#263b76;border-radius:10px;font-size:29px;font-weight:850;width:47px;height:55px}.letter.on{background:#ffdf9d;border-color:#d69a37}.tile{background:#fff;border:2px solid #d1dff3;border-radius:14px;padding:15px;margin:8px 0}.tile.done{border-color:#3cad93;background:#e9f9f2}.tag{border-radius:20px;padding:5px 11px;background:#edf0ff;display:inline-block;color:#535bb0;font-weight:700;font-size:13px}.hintbtn{background:none;border:0;text-decoration:underline;color:#4d59b1;font-weight:700;padding:8px 0}.navtip{border-top:1px solid #e2e8f5;margin-top:14px;padding-top:13px;color:#63718a;font-size:13px}.printonly{display:none}@media(max-width:540px){.page{border-radius:17px;padding:16px}.letter{width:38px;height:49px;font-size:24px}.btn{flex-grow:1}}@media print{.footer,.btn{display:none!important}.page{box-shadow:none}.wrap{max-width:none}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">🛰️ ЛАБОРАТОРИЯ ОРФОГРАММ</div><div class="meter" id="meter"></div></header><div class="rail"><div id="bar"></div></div><section id="scene" class="page" aria-live="polite"></section><footer class="footer"><button class="btn alt" id="back">← Назад</button><button class="btn alt" id="restart">↻ Начать заново</button></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),scene=$('scene');let stage=0;
const state={radar:{},radarHint:{},pair:{},pairHint:{},soft:{},softHint:{},comb:{},combHint:{},proof:{},story:{},end:{},unlock:{},seen:{},picked:null,teacherConfirm:{}};
const title=(n,head,desc)=>`<div class="kicker">Модуль ${n} · миссия для юного исследователя</div><h2>${head}</h2><p class="lead">${desc}</p>`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(name,act,klass='btn')=>`<button class="${klass}" data-a="${act}">${name}</button>`;
const fb=(msg,good)=>`<div class="feedback ${good===true?'ok':good===false?'err':''}">${msg}</div>`;
const shuffle=arr=>{let v=[...arr];for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v};
// Уровень 1: единственная целевая проверяемая гласная в корне; другие гласные могут относиться к приставке/суффиксу.
const radar=[
 {w:'снежинка',idx:2,check:'снег',root:'снеж',why:'Сне́г — снежи́нка. В корне -снеж- безударная Е.'},
 {w:'цветник',idx:2,check:'цвет',root:'цвет',why:'Цве́т — цветни́к. Проверяем Е в корне -цвет-.'},
 {w:'морской',idx:1,check:'море',root:'мор',why:'Мо́ре — морско́й. Проверяем О в корне -мор-.'},
 {w:'побелеть',idx:3,check:'белый',root:'бел',why:'Бе́лый — побеле́ть. Безударная Е в корне, а О — в приставке по-.'},
 {w:'приласкать',idx:4,check:'ласка',root:'ласк',why:'Ла́ска — приласка́ть. Безударная А в корне, а И — в приставке при-.'},
 {w:'заплатить',idx:4,check:'плата',root:'плат',why:'Пла́та — заплати́ть. Безударная А в корне -плат-.'}
];
// Надёжные проверочные слова; по каждому заданию предложены реальные формы и смысловые отвлекающие варианты.
const pairs=[
 {w:'снежинка',o:['снег','нежный','снежинки'],a:0,exp:'Сне́г: Е под ударением; снежинки — лишь другая форма, в которой Е без ударения.'},
 {w:'цветник',o:['цветной','цвет','цветники'],a:1,exp:'Цве́т: Е под ударением. Цветно́й — однокоренное слово, но Е остаётся безударной.'},
 {w:'морской',o:['море','морской','моряк'],a:0,exp:'Мо́ре: О под ударением; моряк и морской не подходят для проверки О.'},
 {w:'побелеть',o:['белизна','белый','побелеет'],a:1,exp:'Бе́лый: Е под ударением. В словах белизна́ и побеле́ет она безударная.'},
 {w:'приласкать',o:['ласковый','ласка́ть','приласкал'],a:0,exp:'Ла́сковый: А под ударением. В других вариантах она безударная.'},
 {w:'заплатить',o:['заплатил','плата','платить'],a:1,exp:'Пла́та: А под ударением. В остальных вариантах проверяемая А остаётся без ударения либо меняется корень.'}
];
// Пишем Ь только когда он разделяет согласную и буквы е, ё, ю, я, и; слова-ловушки без разделительного Ь.
const soft=[
 {blank:'сем_я',word:'семья',a:'ь',note:'Семья́ — близкие люди, живущие вместе или связанные родством. Ь отделяет М от Я.'},
 {blank:'сем_я (растения)',word:'семя',a:'нет',note:'Се́мя — часть растения, из которой может вырасти новое. Здесь разделительного Ь нет.'},
 {blank:'в_юга',word:'вьюга',a:'ь',note:'Вью́га: разделительный Ь после В перед Ю.'},
 {blank:'лист_я',word:'листья',a:'ь',note:'Ли́стья: разделительный Ь между Т и Я.'},
 {blank:'солoв_и',word:'соловьи',a:'ь',note:'Соловьи́: разделительный Ь после В перед И.'},
 {blank:'варен_е',word:'варенье',a:'ь',note:'Варе́нье: разделительный Ь после Н перед Е.'},
 {blank:'бан_я',word:'баня',a:'нет',note:'Ба́ня: между Н и Я разделительного Ь нет; здесь Н обозначает мягкий согласный звук.'},
 {blank:'руч_и',word:'ручьи',a:'ь',note:'Ручьи́: разделительный Ь после Ч перед И.'},
 {blank:'здан_ие',word:'здание',a:'нет',note:'Зда́ние: разделительный Ь не нужен.'},
 {blank:'здоров_е',word:'здоровье',a:'ь',note:'Здоро́вье: разделительный Ь после В перед Е.'}
];
soft[4].blank='солов_и';
// Сочетания ЧК, ЧН, НЧ, НК, ЩН, ЧТ. В заданиях нет опоры на определение рода существительных.
const comb=[
 {w:'дево_ка',ans:'чк',o:['чк','чьк','шк'],why:'Де́вочка: ЧК пишется без Ь.'},
 {w:'но_ной',ans:'чн',o:['чн','чьн','шн'],why:'Но́чной: ЧН пишется без Ь.'},
 {w:'пе_ка',ans:'чк',o:['чьк','чк','чн'],why:'Пе́чка: ЧК пишется без Ь.'},
 {w:'по_ка',ans:'чк',o:['чк','чьк','нч'],why:'По́чка: ЧК пишется без Ь.'},
 {w:'ве_ик',ans:'нч',o:['ньч','нч','нк'],why:'Ве́нчик: НЧ пишется без Ь.'},
 {w:'каме_щик',ans:'нщ',o:['ньщ','нщ','нч'],why:'Ка́менщик: сочетание НЩ пишется без Ь.'},
 {w:'то_кий',ans:'нк',o:['ньк','нк','чк'],why:'То́нкий: НК пишется без Ь.'},
 {w:'моло_ный',ans:'чн',o:['чн','чьн','нч'],why:'Моло́чный: ЧН пишется без Ь.'},
 {w:'изя_ный',ans:'щн',o:['щьн','щн','чн'],why:'Изя́щный: ЩН пишется без Ь.'},
 {w:'ко_ки',ans:'ньк',o:['нк','ньк','нч'],why:'Ко́ньки: Ь нужен для обозначения мягкости Н. Это НЕ сочетание НК без Ь.'}
];
// Контекст: задания подбираются с однозначными ответами и отличают Ь и гласную.
const story=[
 {t:'Утром в городе разыгралась сильная в_юга.',o:['вьюга','вюга'],ans:0,why:'Вью́га — разделительный Ь.'},
 {t:'На дорожке лежала маленькая снеж_нка.',o:['снежинка','снеженка'],ans:0,why:'Сне́г — снежи́нка: проверяем Е.'},
 {t:'У ворот стояла красивая ёло_ка.',o:['ёлочка','ёлочька'],ans:0,why:'Ёлочка: ЧК без Ь.'},
 {t:'Под деревом раскинулся цв_тник.',o:['цветник','цвитник'],ans:0,why:'Цве́т — цветни́к: проверяем Е.'},
 {t:'На окне стояла бан_ка с варен_ем.',o:['банка с вареньем','банька с варенем','банка с варенем'],ans:0,why:'Ба́нка — НК без Ь; варе́ньем — разделительный Ь перед Е.'},
 {t:'Вечером вся сем_я собралась дома.',o:['семья','семя'],ans:0,why:'Семья́ — родственники. Семя — часть растения.'}
];
const finalQ=[
 {q:'В каком слове есть безударная гласная в корне, которую проверим словом «снег»?',o:['снежинка','снег','нежный'],a:0,why:'В снежинка Е без ударения; проверочное слово — сне́г.'},
 {q:'Как проверить безударную Е в слове «побелеть»?',o:['побелеет','белый','побеление'],a:1,why:'Бе́лый: Е в корне под ударением.'},
 {q:'Где нужен разделительный Ь?',o:['семя растения','семья','здание'],a:1,why:'Семья́ — люди, семя — часть растения.'},
 {q:'Как пишется слово?',o:['девочька','девочка','девочъка'],a:1,why:'ЧК пишется без Ь.'},
 {q:'Где Ь нужен, но НЕ является разделительным?',o:['ручьи','коньки','варенье'],a:1,why:'Коньки: Ь обозначает мягкость Н, а не разделяет согласную и гласную.'}
];
const steps=['Вход в лабораторию','Орфографический радар','Подбери проверку','Секрет мягкого знака','Шифр сочетаний','Восстанови историю','Контрольный допуск','Результат'];
function update(){ $('meter').textContent=`Этап ${stage+1} из 8`;$('bar').style.width=(stage+1)/8*100+'%';$('back').disabled=stage===0;render();window.scrollTo(0,0)}
function next(){if(stage<7){stage++;update()}}function prev(){if(stage>0){stage--;update()}}
function options(arr,key,group,disabled=false){return arr.map((v,i)=>`<button class="option ${state[group][key]===i?'active':''}" data-a="choose:${group}:${key}:${i}" ${disabled?'disabled':''}>${esc(v)}</button>`).join('')}
function itemFeedback(group,i,correct,exp){let v=state[group][i];if(v===undefined)return '';return fb(v===correct?'✓ Верно. '+exp:'Проверь ещё раз. '+(state[group+'Hint']?.[i]?'Подсказка: '+exp:'Подумай, какое правило нужно применить.'),v===correct)}
function render(){let h='';
if(stage===0){h=`<div class="hero">🧑‍🚀🤖</div><div class="kicker">Онлайн-квест · 3 класс · около 60 минут</div><h1>Лаборатория орфограмм: код спасения</h1><p class="lead">Робот Пикс потерял важные буквы в своей системе. Восстанови проверяемые гласные, найди проверочные слова, расставь разделительные Ь и взломай шифр сочетаний!</p><div class="grid"><div class="box"><b>🔎 Радар корня</b><p>Находим букву, которую надо проверить.</p></div><div class="box"><b>🧠 Проверка</b><p>Ищем слово, где гласная под ударением.</p></div><div class="box"><b>🔐 Секреты Ь</b><p>Вспоминаем разделительный мягкий знак.</p></div><div class="box"><b>⚡ Шифр сочетаний</b><p>ЧК, ЧН, НЧ, НК, ЩН и исключение с Ь.</p></div></div><div class="note">Правило детектива: сначала подумай, потом выбирай. У некоторых слов похожие буквы, но разные правила.</div><div class="actions">${btn('Начать миссию →','next','btn good')}</div>`}
if(stage===1){h=title(1,'Орфографический радар','Прочитай слово, поставь ударение и нажми на безударную гласную В КОРНЕ, которую нужно проверить.');h+=`<div class="note">Алгоритм: <b>ударение → корень → безударная гласная → проверочное слово</b>. Помни: в приставке тоже могут быть безударные гласные, но сейчас ищем только гласную в корне.</div>`;radar.forEach((r,i)=>{h+=`<div class="tile"><span class="tag">Слово ${i+1}</span><div class="wordparts">${[...r.w].map((c,j)=>`<button class="letter ${state.radar[i]===j?'on':''}" data-a="choose:radar:${i}:${j}" aria-label="Буква ${c}, позиция ${j+1}">${c}</button>`).join('')}</div>${itemFeedback('radar',i,r.idx,r.why)}${state.radar[i]!==r.idx&&state.radar[i]!==undefined?btn('Нужна подсказка','hint:radar:'+i,'btn alt'):''}</div>`});h+=`<div class="actions">${btn('К проверочным словам →','next','btn good')}</div>`}
if(stage===2){h=title(2,'Подбери проверочное слово','Найди слово, в котором нужная гласная в корне находится ПОД УДАРЕНИЕМ. Просто однокоренного слова недостаточно.');pairs.forEach((r,i)=>{h+=`<div class="tile"><span class="tag">Проверка ${i+1}</span><div class="big">${esc(r.w)}</div>${options(r.o,i,'pair')}${itemFeedback('pair',i,r.a,r.exp)}</div>`});h+=`<div class="actions">${btn('К секретному Ь →','next','btn good')}</div>`}
if(stage===3){h=title(3,'Разделительный Ь: где он нужен?','Прочитай слово. Выбери «Ь нужен» или «без Ь». Вспомни: разделительный Ь пишется внутри слова перед Е, Ё, Ю, Я, И после согласной, когда нужно разделить звуки.');h+=`<div class="note">Слова <b>семья</b> и <b>семя</b> — разные по смыслу. <b>Семья</b> — близкие люди, <b>семя</b> — часть растения, из которой вырастает новое.</div>`;soft.forEach((r,i)=>{h+=`<div class="tile"><span class="tag">Слово ${i+1}</span> <span class="word">${esc(r.blank)}</span><div class="chips"><button class="chip ${state.soft[i]===0?'selected':''}" data-a="choose:soft:${i}:0">Ь нужен</button><button class="chip ${state.soft[i]===1?'selected':''}" data-a="choose:soft:${i}:1">Без Ь</button></div>${itemFeedback('soft',i,r.a==='ь'?0:1,r.note)}</div>`});h+=`<div class="actions">${btn('К сочетаниям →','next','btn good')}</div>`}
if(stage===4){h=title(4,'Шифр буквосочетаний','Вставь нужное сочетание букв. Не торопись: ЧК, ЧН, НЧ, НК, НЩ, ЩН обычно пишутся без Ь, но в других местах Ь может быть нужен.');h+=`<div class="note">Например, <b>ночной</b> пишем с ЧН, <b>тонкий</b> — с НК, а <b>коньки</b> — с НЬК: здесь мягкий знак обозначает мягкость согласного Н.</div>`;comb.forEach((r,i)=>{h+=`<div class="tile"><span class="tag">Шифр ${i+1}</span> <span class="word">${esc(r.w)}</span>${options(r.o,i,'comb')}${itemFeedback('comb',i,r.o.indexOf(r.ans),r.why)}</div>`});h+=`<div class="actions">${btn('Секретная разминка →','break','btn good')}</div>`}
if(stage===5){h=title(5,'Восстанови послание','Прочитай предложения и выбери правильный вариант. Не каждое слово требует мягкого знака: иногда нужно проверить гласную или вспомнить буквосочетание.');h+=`<div class="box"><b>🧍‍♂️ Двигательная минутка (3–4 минуты)</b><p>Педагог называет слова. Если нужен разделительный Ь — руки вверх; если ЧК/ЧН/НК без Ь — хлопок; если нужно проверять гласную — ладонь на стол.</p><p class="small">Цепочка для педагога: семья, печка, снежинка, вьюга, ночной, цветник, тонкий, листья.</p></div>`;story.forEach((r,i)=>{h+=`<div class="tile"><span class="tag">Строка ${i+1}</span><div class="big" style="font-size:20px">${esc(r.t)}</div>${options(r.o,i,'story')}${itemFeedback('story',i,r.ans,r.why)}</div>`});h+=`<div class="actions">${btn('Контрольный допуск →','next','btn good')}</div>`}
if(stage===6){h=title(6,'Контрольный допуск','Пять коротких вопросов без автоматических подсказок. Сначала ответь сам, потом нажми «Проверить».');finalQ.forEach((r,i)=>{h+=`<div class="tile"><b>${i+1}. ${esc(r.q)}</b>${options(r.o,i,'end')}${state.unlock[i]?itemFeedback('end',i,r.a,r.why):''}</div>`});h+=`<div class="actions">${btn('Проверить ответы','checkFinal')}${btn('Завершить миссию →','next','btn good')}</div>`}
if(stage===7){let groups=[['Радар','radar',radar],['Проверочные слова','pair',pairs],['Разделительный Ь','soft',soft],['Сочетания','comb',comb],['История','story',story],['Финал','end',finalQ]],total=0,correct=0;const details=groups.map(([name,k,arr])=>{let count=arr.filter((r,i)=>state[k][i]!==undefined).length;let good=arr.filter((r,i)=>{let answer=k==='radar'?r.idx:k==='soft'?(r.a==='ь'?0:1):k==='comb'?r.o.indexOf(r.ans):r.a;return state[k][i]===answer}).length;total+=arr.length;correct+=good;return `<div class="tile"><b>${name}</b> · правильно ${good} из ${arr.length}; выполнено ${count} из ${arr.length}</div>`}).join('');h=`<div class="hero">🏆🤖✨</div><h1>Код лаборатории восстановлен!</h1><p class="lead">Робот Пикс снова умеет проверять слова. Посмотри, какие модули уже освоены и к каким стоит вернуться.</p><div class="box"><div class="big">${correct} правильных ответов из ${total}</div><p class="small">Это результат интерактивных ответов, а не полноценная оценка грамотности. Устные объяснения оценивает педагог.</p></div>${details}<div class="actions">${btn('Повторить трудные этапы','go:1','btn alt')}${btn('Начать заново','reset','btn good')}</div>`}
scene.innerHTML=h+`<div class="navtip">Работает без интернета. Для онлайн-урока ученик может открыть HTML на своём устройстве и нажимать ответы самостоятельно. Этапы можно проходить в удобном темпе.</div>`;document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));}
function act(v){let p=v.split(':');if(p[0]==='next'){next();return}if(p[0]==='go'){stage=Number(p[1]);update();return}if(p[0]==='break'){next();return}if(p[0]==='reset'){if(confirm('Начать заново? Все ответы будут сброшены.'))location.reload();return}if(p[0]==='choose'){let group=p[1],i=Number(p[2]),j=Number(p[3]);state[group][i]=j;render();return}if(p[0]==='hint'){state[p[1]+'Hint'][Number(p[2])]=true;render();return}if(p[0]==='checkFinal'){finalQ.forEach((_,i)=>state.unlock[i]=true);render();return}}
$('back').addEventListener('click',prev);$('restart').addEventListener('click',()=>act('reset'));update();
</script></body></html>
